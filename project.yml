name: Ehru
options:
  bundleIdPrefix: com.lochanpthakke
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Ehru:
    type: application
    platform: iOS
    sources: [Ehru]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lochanpthakke.empee3
        INFOPLIST_FILE: Support/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
    scheme:
      testTargets:
        - EhruTests
  EhruTests:
    type: bundle.unit-test
    platform: iOS
    sources: [EhruTests]
    dependencies:
      - target: Ehru
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
