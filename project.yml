name: Erhu
options:
  bundleIdPrefix: com.erhu
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Erhu:
    type: application
    platform: iOS
    sources: [Erhu]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.erhu
        INFOPLIST_FILE: Support/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
    scheme:
      testTargets:
        - ErhuTests
  ErhuTests:
    type: bundle.unit-test
    platform: iOS
    sources: [ErhuTests]
    dependencies:
      - target: Erhu
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
