name: iOS

on:
  push:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - uses: actions/checkout@v5

      - name: Select newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -iv beta | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build unsigned IPA
        run: |
          set -o pipefail
          mkdir -p build
          if ! xcodebuild build -project Ehru.xcodeproj -scheme Ehru -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" 2>&1 | tee build/compile.log; then
            python3 - <<'PY'
          import os
          from pathlib import Path
          lines = Path('build/compile.log').read_text(errors='replace').splitlines()
          errors = [line for line in lines if 'error:' in line.lower()]
          for error in errors[:12]:
              escaped = error.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print('::error::' + escaped, flush=True)
          detail = '\n'.join(errors or lines[-80:])[-24000:]
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('## Build errors\n\n```text\n' + detail + '\n```\n')
          PY
            exit 1
          fi
          mkdir -p dist/Payload
          cp -R build/Build/Products/Release-iphoneos/Ehru.app dist/Payload/
          (cd dist && zip -qry Ehru.ipa Payload)

      - uses: actions/upload-artifact@v4
        with:
          name: Ehru-ipa
          path: dist/Ehru.ipa
          if-no-files-found: error

      - name: Create iPhone simulator
        run: |
          newest_ios_runtime() {
            xcrun simctl list runtimes available -j | jq -r '
              [.runtimes[] | select(.platform == "iOS")]
              | sort_by(.version | split(".") | map(tonumber)) | last | .identifier // empty'
          }
          RUNTIME=$(newest_ios_runtime)
          if [ -z "$RUNTIME" ]; then
            echo "No iOS simulator runtime installed for this Xcode; downloading one."
            xcodebuild -downloadPlatform iOS
            RUNTIME=$(newest_ios_runtime)
          fi
          DEVICE_TYPE=$(xcrun simctl list runtimes available -j | jq -r --arg runtime "$RUNTIME" '
            .runtimes[] | select(.identifier == $runtime)
            | [.supportedDeviceTypes[] | select(.productFamily == "iPhone")] | last | .identifier')
          echo "Creating $DEVICE_TYPE on $RUNTIME"
          DEVICE=$(xcrun simctl create "CI iPhone" "$DEVICE_TYPE" "$RUNTIME")
          echo "SIMULATOR_ID=$DEVICE" >> "$GITHUB_ENV"

      - name: Run unit tests
        run: |
          xcodebuild test -project Ehru.xcodeproj -scheme Ehru \
            -destination "id=$SIMULATOR_ID" -resultBundlePath build/TestResults.xcresult CODE_SIGNING_ALLOWED=NO

      - name: Upload test results and performance measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Ehru-test-results
          path: build/TestResults.xcresult
          if-no-files-found: warn
