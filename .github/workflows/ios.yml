name: iOS

on:
  push:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - uses: actions/checkout@v5

      # The runner's default Xcode is the one that has simulators installed alongside it.
      - name: Show Xcode version
        run: xcodebuild -version

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Run unit tests
        run: |
          set -o pipefail
          # Newest iPhone simulator this Xcode can run.
          DESTINATIONS=$(xcodebuild -showdestinations -project Ehru.xcodeproj -scheme Ehru)
          DEVICE=$(echo "$DESTINATIONS" \
            | grep 'platform:iOS Simulator' | grep 'name:iPhone' \
            | sed -E 's/.*id:([^,]+), OS:([^,]+),.*/\2 \1/' | sort -V | tail -1 | awk '{print $2}' || true)
          if [ -z "$DEVICE" ]; then
            echo "No iPhone simulator available. Destinations were:"
            echo "$DESTINATIONS"
            exit 1
          fi
          echo "Testing on simulator $DEVICE"
          xcodebuild test -project Ehru.xcodeproj -scheme Ehru \
            -destination "id=$DEVICE" CODE_SIGNING_ALLOWED=NO

      - name: Build unsigned IPA
        run: |
          set -o pipefail
          xcodebuild build -project Ehru.xcodeproj -scheme Ehru -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          mkdir -p dist/Payload
          cp -R build/Build/Products/Release-iphoneos/Ehru.app dist/Payload/
          (cd dist && zip -qry Ehru.ipa Payload)

      - uses: actions/upload-artifact@v4
        with:
          name: Ehru-ipa
          path: dist/Ehru.ipa
          if-no-files-found: error
